apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: userservice
  namespace: bank-of-anthos
spec:
  hosts:
    - userservice.bank-of-anthos.svc.cluster.local
  http:
    - route:
        - destination:
            host: userservice.bank-of-anthos.svc.cluster.local
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure
      timeout: 8s
