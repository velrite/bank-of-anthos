name: Build, Scan, Sign - userservice

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/accounts/userservice/**'
  push:
    branches: [main]
    paths:
      - 'src/accounts/userservice/**'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/velrite/bank-of-anthos-userservice

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  secret-and-dep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Secret scan - userservice folder only, current files only
        run: gitleaks detect --no-git --source=src/accounts/userservice --config=.gitleaks.toml --redact -v

      - name: Dependency vulnerability scan (Trivy, filesystem mode)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: src/accounts/userservice
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1

  build:
    needs: secret-and-dep-scan
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag
        id: tag
        run: echo "tag=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/accounts/userservice
          push: true
          tags: ${{ steps.tag.outputs.tag }}

  image-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Scan built image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image_tag }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.build.outputs.image_tag }}
          artifact-name: userservice-sbom.spdx.json
          output-file: userservice-sbom.spdx.json
      - name: Upload SBOM as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: userservice-sbom.spdx.json

  sign:
    needs: [build, image-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign image (keyless, via GitHub OIDC)
        run: cosign sign --yes ${{ needs.build.outputs.image_tag }}
